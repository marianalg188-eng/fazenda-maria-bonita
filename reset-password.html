<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova senha · Fazenda Maria Bonita</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
</head>
<body>
<main class="login-shell">
  <section class="login-card">
    <div class="brand login-brand"><div class="brand-mark">❧</div><div class="brand-text"><b>Fazenda</b><span>Maria Bonita</span></div></div>
    <p class="eyebrow">ACESSO À FAZENDA</p>
    <h1>Crie uma nova senha.</h1>
    <p class="login-sub">Defina uma nova senha para continuar acessando a Fazenda Maria Bonita.</p>

    <form id="reset-form">
      <label>Nova senha
        <input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="Mínimo de 8 caracteres">
      </label>
      <label>Confirmar nova senha
        <input id="confirm" type="password" minlength="8" autocomplete="new-password" required placeholder="Digite novamente">
      </label>
      <button class="login-btn" type="submit">Salvar nova senha</button>
      <p id="message" class="login-message"></p>
    </form>
  </section>
</main>

<script>
const form=document.getElementById("reset-form");
const message=document.getElementById("message");

supabaseClient.auth.onAuthStateChange((event, session)=>{
  if(event==="PASSWORD_RECOVERY" && session){
    form.style.display="block";
  }
});

form.addEventListener("submit",async event=>{
  event.preventDefault();
  const password=document.getElementById("password").value;
  const confirm=document.getElementById("confirm").value;

  if(password.length<8){
    message.textContent="A senha precisa ter pelo menos 8 caracteres.";
    return;
  }
  if(password!==confirm){
    message.textContent="As senhas não são iguais.";
    return;
  }

  message.textContent="Salvando…";
  const {error}=await supabaseClient.auth.updateUser({password});

  if(error){
    message.textContent="Não foi possível alterar a senha: "+error.message;
    return;
  }

  message.textContent="Senha alterada com sucesso. Redirecionando…";
  form.reset();
  setTimeout(()=>{ window.location.href="login.html"; },1200);
});
</script>
</body>
</html>
