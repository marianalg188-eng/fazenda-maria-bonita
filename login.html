<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · Fazenda Maria Bonita</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
</head>
<body>
<main class="login-shell">
  <section class="login-card">
    <div class="brand login-brand"><div class="brand-mark">❧</div><div class="brand-text"><b>Fazenda</b><span>Maria Bonita</span></div></div>
    <p class="eyebrow">GESTÃO DA FAZENDA</p>
    <h1>Bem-vinda de volta.</h1>
    <p class="login-sub">Entre para acompanhar tarefas, equipe e a rotina da Fazenda Maria Bonita.</p>
    <form id="login-form">
      <label>E-mail<input id="email" type="email" autocomplete="email" required placeholder="seu@email.com"></label>
      <label>Senha<input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"></label>
      <button class="login-btn" type="submit">Entrar</button>
      <p id="login-message" class="login-message"></p>
    </form>
    <p class="login-note">Primeiro acesso? Use a conta criada no Supabase.</p>
  </section>
</main>
<script>
(function(){
  const hash=new URLSearchParams(window.location.hash.slice(1));
  if(hash.get("type")==="recovery"){
    window.location.replace("reset-password.html"+window.location.hash);
  }
})();
</script>
<script>
document.getElementById("login-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const message = document.getElementById("login-message");
  message.textContent = "Entrando…";
  const { error } = await supabaseClient.auth.signInWithPassword({
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value
  });
  if (error) {
    message.textContent = "Não foi possível entrar. Confira e-mail e senha.";
    return;
  }
  window.location.href = "index.html";
});
</script>
</body>
</html>
