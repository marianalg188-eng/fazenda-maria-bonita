<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fazenda Maria Bonita · Estoque</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="app.js"></script></head><body><main class="shell"><header class="topbar"><a class="brand" href="index.html"><div class="brand-mark">❧</div><div class="brand-text"><b>Fazenda</b><span>Maria Bonita</span></div></a><a class="new-btn" href="nova-tarefa.html"><span>+</span><span class="label">Nova tarefa</span></a></div></header><a class="back" href="menu.html">← Menu</a><h1 class="page-title">Estoque</h1><p class="page-sub">Controle o que temos e o que precisamos comprar.</p><section class="section-card"><div class="section-head"><h2>O que precisamos comprar</h2></div><form id="inventory-form"><div class="two"><div class="field"><label>Item</label><input id="name" required placeholder="Ex.: Ração bovina"></div><div class="field"><label>Categoria</label><input id="category" placeholder="Ex.: Alimentação"></div><div class="field"><label>Quantidade</label><input id="quantity" type="number" step="0.01" min="0" value="0"></div><div class="field"><label>Quantidade mínima</label><input id="minimum_quantity" type="number" step="0.01" min="0" value="0"></div><div class="field"><label>Unidade</label><input id="unit" value="un" placeholder="sacos, kg, L..."></div><div class="field"><label>Local</label><input id="location" placeholder="Ex.: Depósito"></div><div class="field"><label>Fornecedor</label><input id="supplier" placeholder="Opcional"></div><div class="field"><label>Custo unitário estimado</label><input id="estimated_unit_cost" type="number" step="0.01" min="0" placeholder="R$"></div></div><button class="submit" type="submit">Cadastrar compra necessária</button><p id="inventory-message" class="login-message"></p></form></section><section class="section-card"><div class="section-head"><h2>Lista de compras</h2></div><div id="purchase-list"><p class="empty-state">Carregando…</p></div></section><section class="section-card"><div class="section-head"><h2>Estoque cadastrado</h2></div><div id="stock-list"><p class="empty-state">Carregando…</p></div></section><div style="text-align:right;margin:18px 0"><a href="#" data-signout class="section-link">Sair →</a></div></main><nav class="bottom-nav"><a href="index.html"><span class="nav-icon">⌂</span>Início</a><a href="tarefas.html"><span class="nav-icon">☷</span>Tarefas</a><a href="equipe.html"><span class="nav-icon">♧</span>Equipe</a><a class="active" href="menu.html"><span class="nav-icon">☰</span>Menu</a></nav><script>
async function loadInventory(){const {data,error}=await supabaseClient.from("inventory_items").select("*").order("created_at",{ascending:false});if(error)return;const items=data||[];document.getElementById("purchase-list").innerHTML=items.filter(x=>x.purchase_needed||x.quantity<=x.minimum_quantity).map(x=>"<div class='stock-row'><div><b>"+esc(x.name)+"</b><span>"+esc(x.quantity)+" "+esc(x.unit)+" · mínimo "+esc(x.minimum_quantity)+" "+esc(x.unit)+(x.supplier?" · "+esc(x.supplier):"")+"</span></div><span class='pill high'>Comprar</span></div>").join("")||"<p class='empty-state'>Nenhum item na lista de compras.</p>";document.getElementById("stock-list").innerHTML=items.map(x=>"<div class='stock-row'><div><b>"+esc(x.name)+"</b><span>"+esc(x.category||"Sem categoria")+" · "+esc(x.quantity)+" "+esc(x.unit)+" · mínimo "+esc(x.minimum_quantity)+"</span></div><span class='pill "+(x.quantity<=x.minimum_quantity?"high":"low")+"'>"+(x.quantity<=x.minimum_quantity?"Baixo":"Normal")+"</span></div>").join("")||"<p class='empty-state'>Nenhum item cadastrado.</p>"}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
requireAuth().then(()=>{initFarmApp();loadInventory()});
document.getElementById("inventory-form").addEventListener("submit",async e=>{e.preventDefault();const msg=document.getElementById("inventory-message");const {error}=await supabaseClient.from("inventory_items").insert({name:document.getElementById("name").value.trim(),category:document.getElementById("category").value.trim()||null,quantity:Number(document.getElementById("quantity").value||0),minimum_quantity:Number(document.getElementById("minimum_quantity").value||0),unit:document.getElementById("unit").value.trim()||"un",location:document.getElementById("location").value.trim()||null,supplier:document.getElementById("supplier").value.trim()||null,estimated_unit_cost:document.getElementById("estimated_unit_cost").value?Number(document.getElementById("estimated_unit_cost").value):null,purchase_needed:true});if(error){msg.textContent="Não foi possível cadastrar o item.";return}msg.textContent="Item adicionado à lista de compras.";e.target.reset();document.getElementById("unit").value="un";loadInventory()});
</script></body></html>
