<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fazenda Maria Bonita · Nova tarefa</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="app.js"></script></head><body><main class="shell"><header class="topbar"><a class="brand" href="index.html"><div class="brand-mark">❧</div><div class="brand-text"><b>Fazenda</b><span>Maria Bonita</span></div></a></header><div class="form-wrap"><a class="back" href="index.html">← Voltar</a><h1 class="page-title">Nova tarefa</h1><p class="page-sub">Registre algo que precisa acontecer na fazenda.</p><form id="task-form" class="form-card"><div class="field"><label>Tarefa</label><textarea id="title" required placeholder="O que precisa ser feito?"></textarea></div><div class="field"><label>Centro de custo</label><select id="front" required><option value="">Selecione a centro de custo</option><option>FRS PJ</option><option>FSA PJ</option><option>FBV PF</option><option>GMB PJ</option><option>FLV PJ</option><option>JCML</option><option>MLFL</option><option>CFL</option><option>FFL</option><option>ACFL</option><option value="__custom">Outros</option></select></div><div class="field" id="custom-front-field" style="display:none"><label>Nova centro de custo</label><input id="custom-front" placeholder="Digite o nome da nova centro de custo"></div><div class="field"><label>Área</label><select id="sector" required><option value="">Selecione a área</option><option>Compras</option><option>Financeiro</option><option>RH</option><option>Jurídico</option><option>Ambiental</option><option>Vendas</option><option>Novos negócios</option><option>Obra/Manutenção</option><option>Casa Sede</option><option>Particular</option></select></div><div class="field"><label>Data de criação</label><input id="created-date" type="date" readonly></div><div class="field"><label>Prazo</label><input id="due_date" type="date"></div><div class="field"><label>Prioridade</label><select id="priority" required><option value="">Selecione</option><option value="high">Alta</option><option value="medium">Média</option><option value="low">Baixa</option></select></div><div class="field"><label>Responsável</label><select id="responsible" required><option value="">Carregando equipe…</option></select></div><div class="field"><label>Solicitante</label><select id="requester" required><option value="">Carregando usuários…</option></select></div><div class="field"><label>Descrição / observações</label><textarea id="description" placeholder="Adicione observações..."></textarea></div><div class="field"><label>Anexo</label><input id="attachment" type="file"><small style="display:block;margin-top:6px;opacity:.7">Você pode anexar um documento, imagem ou outro arquivo.</small></div><button class="submit" type="submit">Criar tarefa</button><p id="form-message" class="login-message"></p></form></div></main><nav class="bottom-nav"><a href="index.html"><span class="nav-icon">⌂</span>Início</a><a href="tarefas.html"><span class="nav-icon">☷</span>Tarefas</a><a href="equipe.html"><span class="nav-icon">♧</span>Equipe</a><a href="menu.html"><span class="nav-icon">☰</span>Menu</a></nav><script>
let currentSession;
function todayLocal(){const d=new Date();const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
async function loadPeople(ctx){currentSession=ctx.session;document.getElementById("created-date").value=todayLocal();const {data,error}=await supabaseClient.from("profiles").select("id,name").eq("active",true).order("name");const s=document.getElementById("responsible"),r=document.getElementById("requester");if(error||!data?.length){s.innerHTML='<option value="">Nenhuma pessoa cadastrada</option>';r.innerHTML='<option value="">Nenhum usuário cadastrado</option>';return}s.innerHTML='<option value="">Selecione o responsável</option>'+data.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join("");r.innerHTML='<option value="">Selecione o solicitante</option>'+data.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join("")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
initFarmApp().then(loadPeople);
document.getElementById("front").addEventListener("change",e=>{document.getElementById("custom-front-field").style.display=e.target.value==="__custom"?"block":"none";if(e.target.value!=="__custom")document.getElementById("custom-front").value=""});
document.getElementById("task-form").addEventListener("submit",async e=>{e.preventDefault();const msg=document.getElementById("form-message");msg.textContent="Salvando…";const frontSelect=document.getElementById("front").value;const front=frontSelect==="__custom"?document.getElementById("custom-front").value.trim():frontSelect;if(!front){msg.textContent="Selecione ou crie uma centro de custo.";return}const file=document.getElementById("attachment").files[0];let attachment_path=null,attachment_name=null;const {data:task,error}=await supabaseClient.from("tasks").insert({title:document.getElementById("title").value.trim(),description:document.getElementById("description").value.trim()||null,front,sector:document.getElementById("sector").value,category:document.getElementById("sector").value,priority:document.getElementById("priority").value,due_date:document.getElementById("due_date").value||null,responsible_id:document.getElementById("responsible").value,requester_id:document.getElementById("requester").value,status:"pending",created_by:currentSession.user.id}).select("id").single();if(error){msg.textContent="Não foi possível criar a tarefa.";return}msg.textContent="Tarefa criada com sucesso!";if(file){const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");attachment_path=currentSession.user.id+"/"+Date.now()+"_"+safe;attachment_name=file.name;const up=await supabaseClient.storage.from("task-attachments").upload(attachment_path,file,{upsert:false});if(!up.error)await supabaseClient.from("tasks").update({attachment_path,attachment_name}).eq("id",task.id)}setTimeout(()=>window.location.href="tarefas.html",200);});
</script></body></html>
