<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fazenda Maria Bonita · Nova tarefa</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="app.js"></script></head><body><main class="shell"><script>initFarmApp().then(loadPeople);</script><header class="topbar"><a class="brand" href="index.html"><div class="brand-mark">❧</div><div class="brand-text"><b>Fazenda</b><span>Maria Bonita</span></div></a></header><div class="form-wrap"><a class="back" href="index.html">← Voltar</a><h1 class="page-title">Nova tarefa</h1><p class="page-sub">Registre algo que precisa acontecer na fazenda.</p><form id="task-form" class="form-card"><div class="field"><label>O que precisa ser feito?</label><textarea id="title" required placeholder="Descreva a tarefa..."></textarea></div><div class="field"><label>Área</label><select id="category"><option value="">Selecione a área</option><option>Animais</option><option>Plantação</option><option>Manutenção</option><option>Casa</option><option>Estoque</option></select></div><div class="field"><label>Responsável</label><select id="responsible"><option value="">Selecione um responsável</option></select></div><div class="two"><div class="field"><label>Prazo</label><input id="due_date" type="date"></div><div class="field"><label>Prioridade</label><select id="priority"><option value="medium">Média</option><option value="high">Alta</option><option value="low">Baixa</option><option value="urgent">Urgente</option></select></div></div><div class="field"><label>Recorrência</label><select id="recurrence"><option value="">Única</option><option>Diária</option><option>Semanal</option><option>Mensal</option></select></div><div class="field"><label>Observações</label><textarea id="description" placeholder="Adicione observações..."></textarea></div><button class="submit" type="submit">Criar tarefa</button><p id="form-message" class="login-message"></p></form></div></main><nav class="bottom-nav"><a href="index.html"><span class="nav-icon">⌂</span>Início</a><a href="tarefas.html"><span class="nav-icon">☷</span>Tarefas</a><a href="equipe.html"><span class="nav-icon">♧</span>Equipe</a><a href="menu.html"><span class="nav-icon">☰</span>Menu</a></nav><script>
let currentSession;
async function loadPeople(ctx){currentSession=ctx.session;const {data}=await supabaseClient.from("profiles").select("id,name").eq("active",true).order("name");const s=document.getElementById("responsible");(data||[]).forEach(p=>{const o=document.createElement("option");o.value=p.id;o.textContent=p.name;s.appendChild(o)});}
document.getElementById("task-form").addEventListener("submit",async e=>{e.preventDefault();const msg=document.getElementById("form-message");msg.textContent="Salvando…";const {error}=await supabaseClient.from("tasks").insert({title:document.getElementById("title").value.trim(),description:document.getElementById("description").value.trim()||null,category:document.getElementById("category").value||null,priority:document.getElementById("priority").value,due_date:document.getElementById("due_date").value||null,responsible_id:document.getElementById("responsible").value||null,recurrence:document.getElementById("recurrence").value||null,status:"pending",created_by:currentSession.user.id});if(error){msg.textContent="Não foi possível criar a tarefa. Verifique os dados.";return}window.location.href="tarefas.html";});
</script></body></html>
