<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fazenda Maria Bonita · Animais</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="app.js"></script></head><body><main class="shell"><header class="topbar"><a class="brand" href="index.html"><div class="brand-mark">❧</div><div class="brand-text"><b>Fazenda</b><span>Maria Bonita</span></div></a><a class="new-btn" href="nova-tarefa.html"><span>+</span><span class="label">Nova tarefa</span></a></header><a class="back" href="menu.html">← Menu</a><h1 class="page-title">Animais</h1><p class="page-sub">Cadastro individual do rebanho da Fazenda Maria Bonita.</p><section class="section-card"><div class="section-head"><h2>Novo animal</h2></div><form id="animal-form"><div class="two"><div class="field"><label>ID</label><input id="animal_id" required placeholder="Ex.: MB-001"></div><div class="field"><label>Lote</label><input id="lot" placeholder="Ex.: Lote 01"></div><div class="field"><label>Localidade</label><input id="locality" placeholder="Ex.: Pasto Norte"></div><div class="field"><label>Categoria</label><input id="category" placeholder="Ex.: Bezerra"></div><div class="field"><label>Raça</label><input id="breed" placeholder="Ex.: Nelore"></div><div class="field"><label>Data de nascimento</label><input id="birth_date" type="date"></div><div class="field"><label>Sexo</label><select id="sex" required><option value="">Selecione</option><option>Fêmea</option><option>Macho</option></select></div></div><button class="submit" type="submit">Cadastrar animal</button><p id="animal-message" class="login-message"></p></form></section><section class="section-card"><div class="section-head"><h2>Animais cadastrados</h2></div><div id="animal-list"><p class="empty-state">Carregando…</p></div></section><div style="text-align:right;margin:18px 0"><a href="#" data-signout class="section-link">Sair →</a></div></main><nav class="bottom-nav"><a href="index.html"><span class="nav-icon">⌂</span>Início</a><a href="tarefas.html"><span class="nav-icon">☷</span>Tarefas</a><a href="equipe.html"><span class="nav-icon">♧</span>Equipe</a><a class="active" href="menu.html"><span class="nav-icon">☰</span>Menu</a></nav><script>
async function loadAnimals(){const box=document.getElementById("animal-list");const {data,error}=await supabaseClient.from("animals").select("animal_id,lot,locality,category,breed,birth_date,sex").order("animal_id");if(error){box.innerHTML="<p class='empty-state'>Não foi possível carregar animais.</p>";return}box.innerHTML=(data||[]).map(x=>"<div class='task-row'><div class='task-main'><div class='task-title'>"+esc(x.animal_id)+" · "+esc(x.breed||"Raça não informada")+"</div><div class='task-meta'>Lote: "+esc(x.lot||"—")+" · Localidade: "+esc(x.locality||"—")+" · Categoria: "+esc(x.category||"—")+" · Nascimento: "+esc(x.birth_date||"—")+" · Sexo: "+esc(x.sex||"—")+"</div></div></div>").join("")||"<p class='empty-state'>Nenhum animal cadastrado.</p>"}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
requireAuth().then(()=>{initFarmApp();loadAnimals()});
document.getElementById("animal-form").addEventListener("submit",async e=>{e.preventDefault();const msg=document.getElementById("animal-message");const payload={name:document.getElementById("animal_id").value.trim(),animal_id:document.getElementById("animal_id").value.trim(),lot:document.getElementById("lot").value.trim()||null,locality:document.getElementById("locality").value.trim()||null,category:document.getElementById("category").value.trim()||null,breed:document.getElementById("breed").value.trim()||null,birth_date:document.getElementById("birth_date").value||null,sex:document.getElementById("sex").value};const {error}=await supabaseClient.from("animals").insert(payload);if(error){msg.textContent=error.code==="23505"?"Esse ID já está cadastrado.":"Não foi possível cadastrar o animal.";return}msg.textContent="Animal cadastrado com sucesso.";e.target.reset();loadAnimals()});
</script></body></html>
