<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fazenda Maria Bonita · Animais</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="app.js"></script></head><body><main class="shell"><header class="topbar"><a class="brand" href="index.html"><div class="brand-mark">❧</div><div class="brand-text"><b>Fazenda</b><span>Maria Bonita</span></div></a><a class="new-btn" href="nova-tarefa.html"><span>+</span><span class="label">Nova tarefa</span></a></header><a class="back" href="menu.html">← Menu</a><h1 class="page-title">Cadastro de animais</h1><p class="page-sub">Animais, baixas e vendas por fazenda.</p><section class="section-card" id="animais-por-fazenda"><div class="section-head"><h2>Animais por fazenda</h2><span class="section-link">Base 31/08/2026</span></div><div id="farm-animal-summary"><p class="empty-state">Carregando…</p></div></section><section class="section-card"><div class="section-head"><h2>Novo animal</h2></div><form id="animal-form"><div class="two"><div class="field"><label>Fazenda</label><select id="farm_id" required><option value="">Selecione</option></select></div><div class="field"><label>ID</label><input id="animal_id" required placeholder="Ex.: MB-001"></div><div class="field"><label>Lote</label><input id="lot"></div><div class="field"><label>Localidade</label><input id="locality"></div><div class="field"><label>Categoria</label><input id="category"></div><div class="field"><label>Raça</label><input id="breed"></div><div class="field"><label>Data de nascimento</label><input id="birth_date" type="date"></div><div class="field"><label>Sexo</label><select id="sex" required><option value="">Selecione</option><option>Fêmea</option><option>Macho</option></select></div></div><button class="submit" type="submit">Cadastrar animal</button><p id="animal-message" class="login-message"></p></form></section><section class="section-card"><div class="section-head"><h2>Registrar baixa ou venda</h2></div><form id="movement-form"><div class="two"><div class="field"><label>Fazenda</label><select id="movement-farm" required><option value="">Selecione</option></select></div><div class="field"><label>Tipo</label><select id="movement-type" required><option value="death">Baixa / morte</option><option value="sale">Venda</option></select></div><div class="field"><label>Data</label><input id="movement-date" type="date" required></div><div class="field"><label>ID do animal</label><input id="movement-animal-id" placeholder="Opcional"></div><div class="field"><label>Quantidade</label><input id="movement-quantity" type="number" min="1" value="1" required></div><div class="field"><label>Motivo / comprador</label><input id="movement-detail"></div><div class="field"><label>Observações</label><textarea id="movement-notes"></textarea></div></div><button class="submit" type="submit">Registrar movimentação</button><p id="movement-message" class="login-message"></p></form></section><section class="section-card"><div class="section-head"><h2>Animais cadastrados</h2><select id="farm-filter"><option value="">Selecione uma fazenda</option></select></div><div id="animal-list"><p class="empty-state">Carregando…</p></div></section><section class="section-card"><div class="section-head"><h2>Últimas baixas e vendas</h2></div><div id="movement-list"><p class="empty-state">Carregando…</p></div></section><div style="text-align:right;margin:18px 0"><a href="#" data-signout class="section-link">Sair →</a></div></main><nav class="bottom-nav"><a href="index.html"><span class="nav-icon">⌂</span>Início</a><a href="tarefas.html"><span class="nav-icon">☷</span>Tarefas</a><a href="equipe.html"><span class="nav-icon">♧</span>Equipe</a><a class="active" href="menu.html"><span class="nav-icon">☰</span>Menu</a></nav><script>
let farms=[];
async function loadSummary(){document.getElementById("farm-animal-summary").innerHTML='<p class="empty-state">Carregando resumo…</p>';const {data}=await supabaseClient.from("farm_animal_summary").select("animal_count,death_count,sale_count,farms(code,name)").order("animal_count",{ascending:false});document.getElementById("farm-animal-summary").innerHTML=(data||[]).map(x=>'<div class="task-row"><div class="task-main"><div class="task-title">'+esc(x.farms?.code||"")+' · '+esc(x.farms?.name||"")+'</div><div class="task-meta">Animais: '+x.animal_count+' · Baixas: '+x.death_count+' · Vendas: '+x.sale_count+'</div></div></div>').join("")||'<p class="empty-state">Nenhum resumo disponível.</p>'}
async function loadFarms(){const r=await supabaseClient.from("farms").select("id,code,name").eq("active",true).order("code");farms=r.data||[];["farm_id","movement-farm","farm-filter"].forEach(id=>{const s=document.getElementById(id);if(id==="farm-filter")s.innerHTML='<option value="">Todas as fazendas</option>';farms.forEach(f=>{const o=document.createElement("option");o.value=f.id;o.textContent=f.code+" · "+f.name;s.appendChild(o)})})}
async function loadAnimals(){const farm=document.getElementById("farm-filter").value;const box=document.getElementById("animal-list");if(!farm){box.innerHTML='<p class="empty-state">Selecione uma fazenda para carregar os animais.</p>';return}box.innerHTML='<p class="empty-state">Carregando animais…</p>';const {data,error}=await supabaseClient.from("animals").select("animal_id,lot,locality,category,breed,birth_date,sex,farm_id,farms(code)").eq("farm_id",farm).order("animal_id").range(0,49);if(error){box.innerHTML='<p class="empty-state">Não foi possível carregar animais.</p>';return}box.innerHTML=(data||[]).map(x=>'<div class="task-row"><div class="task-main"><div class="task-title">'+esc(x.farms?.code||"")+" · "+esc(x.animal_id)+"</div><div class="task-meta">Lote: "+esc(x.lot||"—")+" · Localidade: "+esc(x.locality||"—")+" · Categoria: "+esc(x.category||"—")+" · Raça: "+esc(x.breed||"—")+" · Nascimento: "+esc(x.birth_date||"—")+" · Sexo: "+esc(x.sex||"—")+'</div></div></div>').join("")||'<p class="empty-state">Nenhum animal cadastrado.</p>'}
async function loadMovements(){const {data,error}=await supabaseClient.from("animal_movements").select("*,farms(code)").order("movement_date",{ascending:false}).limit(30);const box=document.getElementById("movement-list");if(error){box.innerHTML='<p class="empty-state">Não foi possível carregar movimentações.</p>';return}box.innerHTML=(data||[]).map(x=>'<div class="task-row"><span class="pill '+(x.movement_type==="death"?"high":"medium")+'">'+(x.movement_type==="death"?"Baixa":"Venda")+'</span><div class="task-main"><div class="task-title">'+esc(x.farms?.code||"")+" · "+esc(x.animal_visual_id||"Sem ID")+'</div><div class="task-meta">'+esc(x.movement_date)+" · Quantidade: "+esc(x.quantity)+" · "+esc(x.reason||"")+'</div></div></div>').join("")||'<p class="empty-state">Nenhuma movimentação registrada.</p>'}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
requireAuth().then(async()=>{await initFarmApp();await Promise.all([loadSummary(),loadFarms(),loadMovements()])});
document.getElementById("farm-filter").onchange=loadAnimals;
document.getElementById("animal-form").onsubmit=async e=>{e.preventDefault();const msg=document.getElementById("animal-message");const {error}=await supabaseClient.from("animals").insert({name:document.getElementById("animal_id").value.trim(),animal_id:document.getElementById("animal_id").value.trim(),farm_id:document.getElementById("farm_id").value,lot:document.getElementById("lot").value.trim()||null,locality:document.getElementById("locality").value.trim()||null,category:document.getElementById("category").value.trim()||null,breed:document.getElementById("breed").value.trim()||null,birth_date:document.getElementById("birth_date").value||null,sex:document.getElementById("sex").value});msg.textContent=error?(error.code==="23505"?"Esse ID já está cadastrado.":"Não foi possível cadastrar o animal."):"Animal cadastrado com sucesso.";if(!error){e.target.reset();loadAnimals()}};
document.getElementById("movement-form").onsubmit=async e=>{e.preventDefault();const msg=document.getElementById("movement-message");const type=document.getElementById("movement-type").value;const payload={farm_id:document.getElementById("movement-farm").value,movement_type:type,movement_date:document.getElementById("movement-date").value,animal_visual_id:document.getElementById("movement-animal-id").value.trim()||null,quantity:Number(document.getElementById("movement-quantity").value||1),reason:document.getElementById("movement-detail").value.trim()||null,notes:document.getElementById("movement-notes").value.trim()||null};const {error}=await supabaseClient.from("animal_movements").insert(payload);msg.textContent=error?"Não foi possível registrar a movimentação.":"Movimentação registrada com sucesso.";if(!error){e.target.reset();document.getElementById("movement-quantity").value=1;loadMovements()}};
</script></body></html>
