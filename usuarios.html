<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fazenda Maria Bonita · Usuários</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script></head><body><main class="shell"><header class="topbar"><a class="brand" href="index.html"><div class="brand-mark">❧</div><div class="brand-text"><b>Fazenda</b><span>Maria Bonita</span></div></a></header><a class="back" href="menu.html">← Voltar</a><h1 class="page-title">Usuários</h1><p class="page-sub">Atualize seu nome e sua foto de perfil.</p><form id="profile-form" class="form-card"><div style="text-align:center;margin-bottom:22px"><div id="avatar-preview" class="avatar" style="margin:0 auto 12px;width:88px;height:88px;font-size:36px;overflow:hidden">👤</div><label class="submit" style="display:inline-block;cursor:pointer">Escolher foto<input id="avatar" type="file" accept="image/*" style="display:none"></label></div><div class="field"><label>Nome</label><input id="name" required placeholder="Seu nome"></div><div class="field"><label>E-mail</label><input id="email" disabled></div><button class="submit" type="submit">Salvar alterações</button><p id="message" class="login-message"></p></form></main><nav class="bottom-nav"><a href="index.html"><span class="nav-icon">⌂</span>Início</a><a href="tarefas.html"><span class="nav-icon">☷</span>Tarefas</a><a href="equipe.html"><span class="nav-icon">♧</span>Equipe</a><a class="active" href="menu.html"><span class="nav-icon">☰</span>Menu</a></nav><script>let session,profile;async function load(){const {data:{session:s}}=await supabaseClient.auth.getSession();session=s;const {data:p,error}=await supabaseClient.from("profiles").select("id,name,email,avatar_path").eq("id",s.user.id).single();if(error)return;profile=p;document.getElementById("name").value=p.name||"";document.getElementById("email").value=p.email||s.user.email||"";if(p.avatar_path){const u=await supabaseClient.storage.from("profile-avatars").createSignedUrl(p.avatar_path,3600);if(u.data?.signedUrl)document.getElementById("avatar-preview").innerHTML='<img src="'+u.data.signedUrl+'" style="width:100%;height:100%;object-fit:cover" alt="Foto de perfil">'} }requireAuth().then(load);document.getElementById("avatar").addEventListener("change",e=>{const f=e.target.files[0];if(f)document.getElementById("avatar-preview").innerHTML='<img src="'+URL.createObjectURL(f)+'" style="width:100%;height:100%;object-fit:cover" alt="Prévia">'});document.getElementById("profile-form").addEventListener("submit",async e=>{e.preventDefault();const msg=document.getElementById("message");msg.textContent="Salvando…";const f=document.getElementById("avatar").files[0];let path=profile.avatar_path||null;if(f){const ext=(f.name.split(".").pop()||"jpg").toLowerCase();path=session.user.id+"/profile."+ext;const up=await supabaseClient.storage.from("profile-avatars").upload(path,f,{upsert:true});if(up.error){msg.textContent="Não foi possível enviar a foto.";return}}const upProfile=await supabaseClient.from("profiles").update({name:document.getElementById("name").value.trim(),avatar_path:path,updated_at:new Date().toISOString()}).eq("id",session.user.id);if(upProfile.error){msg.textContent="Não foi possível salvar o perfil.";return}msg.textContent="Perfil atualizado com sucesso.";profile.name=document.getElementById("name").value.trim();profile.avatar_path=path});</script></body></html>
