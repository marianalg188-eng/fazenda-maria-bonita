<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fazenda Maria Bonita · Tarefa</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="app.js"></script><style>
.delete-task-btn{border:1px solid #d9b0a6;background:#fbf1ed;color:#a34d39;border-radius:10px;padding:9px 13px;font-size:11px;font-weight:600;cursor:pointer}
.delete-task-btn:hover{background:#f5dfd8}
</style></head><body><main class="shell"><header class="topbar"><a class="brand" href="index.html"><div class="brand-mark">❧</div><div class="brand-text"><b>Fazenda</b><span>Maria Bonita</span></div></a><div class="user-actions"><a class="new-btn" href="nova-tarefa.html"><span class="plus">+</span><span class="label">Nova tarefa</span></a></div></header><a class="back" href="tarefas.html">← Voltar para tarefas</a><div id="task-detail"><p class="empty-state">Carregando tarefa…</p></div><div id="comments-section" class="detail-section" style="display:none"><div class="section-head"><div><h2>Comentários</h2><p class="page-sub">Registre atualizações, dúvidas ou informações importantes.</p></div></div><div id="comments-list" class="comments-list"><p class="empty-state">Nenhum comentário ainda.</p></div><form id="comment-form" class="comment-form"><textarea id="comment-input" rows="4" maxlength="2000" placeholder="Escreva um comentário..."></textarea><div class="comment-attachment"><label for="comment-file" class="attach-btn">＋ Anexar arquivo</label><input id="comment-file" type="file" hidden><span id="file-name" class="form-hint">Nenhum arquivo selecionado</span></div><div class="comment-actions"><span id="comment-status" class="form-hint"></span><button class="new-btn" type="submit">Adicionar comentário</button></div></form></div><div style="text-align:right;margin:18px 0"><a href="#" data-signout class="section-link">Sair →</a></div></main><nav class="bottom-nav"><a href="index.html"><span class="nav-icon">⌂</span>Início</a><a class="active" href="tarefas.html"><span class="nav-icon">☷</span>Tarefas</a><a href="equipe.html"><span class="nav-icon">♧</span>Equipe</a><a href="menu.html"><span class="nav-icon">☰</span>Menu</a></nav><script>
const taskId=new URLSearchParams(location.search).get("id");let currentUser=null,isAdmin=false,currentTask=null,people=[];
const labels={pending:"Pendente",blocked:"Bloqueado · Pendência",in_progress:"Em andamento",completed:"Concluído",deprioritized:"Despriorizado",cancelled:"Cancelado"};const priorities={urgent:"Urgente",high:"Alta",medium:"Média",low:"Baixa"};
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}function dateText(v){if(!v)return"Sem prazo";const[y,m,d]=v.split("-");return d+"/"+m+"/"+y}
async function loadTask(){if(!taskId){document.getElementById("task-detail").innerHTML='<p class="empty-state">Tarefa não encontrada.</p>';return}const r=await supabaseClient.from("tasks").select("*").eq("id",taskId).single();if(r.error||!r.data){document.getElementById("task-detail").innerHTML='<p class="empty-state">Não foi possível encontrar esta tarefa.</p>';return}currentTask=r.data;const ids=[currentTask.responsible_id,currentTask.requester_id,currentTask.created_by].filter(Boolean);const p=await supabaseClient.from("profiles").select("id,name").eq("active",true).order("name");people=p.data||[];let names=Object.fromEntries(people.map(x=>[x.id,x.name]));document.getElementById("task-detail").innerHTML='<div class="task-detail-card"><div class="detail-top"><div><span class="detail-label">TAREFA</span><h1 class="page-title">'+esc(currentTask.title)+'</h1></div><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="pill '+(currentTask.priority||"medium")+'">'+esc(priorities[currentTask.priority]||"Média")+'</span><button type="button" class="new-btn" onclick="editTask()">Editar tarefa</button><button type="button" class="delete-task-btn" onclick="deleteTask()">Excluir tarefa</button></div></div><div class="detail-grid"><div><span class="detail-label">Status</span><strong>'+esc(labels[currentTask.status]||currentTask.status||"Pendente")+'</strong></div><div><span class="detail-label">Prazo</span><strong>'+dateText(currentTask.due_date)+'</strong></div><div><span class="detail-label">Responsável</span><strong>'+esc(names[currentTask.responsible_id]||"Não definido")+'</strong></div><div><span class="detail-label">Solicitante</span><strong>'+esc(names[currentTask.requester_id]||"Não definido")+'</strong></div><div><span class="detail-label">Centro de custo</span><strong>'+esc(currentTask.front||"Não informado")+'</strong></div><div><span class="detail-label">Área</span><strong>'+esc(currentTask.category||currentTask.sector||"Não informada")+'</strong></div></div><div class="detail-description"><span class="detail-label">Descrição / observações</span><p>'+esc(currentTask.description||"Nenhuma descrição informada.")+'</p></div></div>';document.getElementById("comments-section").style.display="block";loadComments()}

function editTask(){if(!currentTask)return;const personOptions='<option value="">Selecione</option>'+people.map(p=>'<option value="'+p.id+'" '+(p.id===currentTask.responsible_id||p.id===currentTask.requester_id?"":"")+'>'+esc(p.name)+'</option>').join("");document.getElementById("task-detail").innerHTML='<form class="task-detail-card" id="edit-task-form"><div class="detail-top"><div><span class="detail-label">EDITAR TAREFA</span><h1 class="page-title">Editar tarefa</h1></div></div><div class="field"><label>Tarefa</label><textarea id="edit-title" required>'+esc(currentTask.title)+'</textarea></div><div class="detail-grid"><div class="field"><label>Status</label><select id="edit-status"><option value="pending">Pendente</option><option value="blocked">Bloqueado · Pendência</option><option value="in_progress">Em andamento</option><option value="completed">Concluído</option><option value="deprioritized">Despriorizado</option></select></div><div class="field"><label>Prioridade</label><select id="edit-priority"><option value="urgent">Urgente</option><option value="high">Alta</option><option value="medium">Média</option><option value="low">Baixa</option></select></div><div class="field"><label>Prazo</label><input id="edit-due" type="date" value="'+(currentTask.due_date||"")+'"></div><div class="field"><label>Responsável</label><select id="edit-responsible">'+personOptions+'</select></div><div class="field"><label>Solicitante</label><select id="edit-requester">'+personOptions+'</select></div><div class="field"><label>Centro de custo</label><input id="edit-front" value="'+esc(currentTask.front||"")+'"></div><div class="field"><label>Área</label><select id="edit-sector"><option>Operacional</option><option>Administrativo</option><option>Gado</option><option>Compras</option><option>Financeiro</option><option>RH</option><option>Jurídico</option><option>Ambiental</option><option>Vendas</option><option>Novos negócios</option><option>Obra/Manutenção</option><option>Casa Sede</option><option>Particular</option></select></div></div><div class="field"><label>Descrição / observações</label><textarea id="edit-description">'+esc(currentTask.description||"")+'</textarea></div><div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="section-link" onclick="loadTask()">Cancelar</button><button class="new-btn" type="submit">Salvar alterações</button></div><p id="edit-status-msg" class="form-hint"></p></form>';document.getElementById("edit-status").value=currentTask.status||"pending";document.getElementById("edit-priority").value=currentTask.priority||"medium";document.getElementById("edit-responsible").value=currentTask.responsible_id||"";document.getElementById("edit-requester").value=currentTask.requester_id||"";document.getElementById("edit-sector").value=currentTask.category||currentTask.sector||"Operacional";document.getElementById("edit-task-form").addEventListener("submit",saveTaskEdit)}

async function saveTaskEdit(e){e.preventDefault();const msg=document.getElementById("edit-status-msg");const payload={title:document.getElementById("edit-title").value.trim(),status:document.getElementById("edit-status").value,priority:document.getElementById("edit-priority").value,due_date:document.getElementById("edit-due").value||null,responsible_id:document.getElementById("edit-responsible").value||null,requester_id:document.getElementById("edit-requester").value||null,front:document.getElementById("edit-front").value.trim()||null,sector:document.getElementById("edit-sector").value,category:document.getElementById("edit-sector").value,description:document.getElementById("edit-description").value.trim()||null,updated_at:new Date().toISOString(),updated_by:currentUser?.id||null};if(!payload.title){msg.textContent="Informe o nome da tarefa.";return}msg.textContent="Salvando…";const r=await supabaseClient.from("tasks").update(payload).eq("id",taskId);if(r.error){msg.textContent="Não foi possível salvar: "+r.error.message;return}localStorage.setItem("task-status-updated",String(Date.now()));msg.textContent="Alterações salvas.";await loadTask()}

async function deleteTask(){
 
 if(!taskId)return;
 const confirmed=confirm("Excluir esta tarefa definitivamente?\\n\\nA tarefa, os comentários e os arquivos anexados serão removidos. Esta ação não pode ser desfeita.");
 if(!confirmed)return;
 try{
   const comments=await supabaseClient.from("task_comments").select("attachment_path").eq("task_id",taskId);
   if(comments.error)throw comments.error;
   const paths=(comments.data||[]).map(x=>x.attachment_path).filter(Boolean);
   const task=await supabaseClient.from("tasks").select("attachment_path").eq("id",taskId).single();
   if(task.error)throw task.error;
   if(task.data?.attachment_path)paths.push(task.data.attachment_path);
   const unique=[...new Set(paths)];
   if(unique.length){
     const storage=await supabaseClient.storage.from("task-attachments").remove(unique);
     if(storage.error)throw storage.error;
   }
   const delComments=await supabaseClient.from("task_comments").delete().eq("task_id",taskId);
   if(delComments.error)throw delComments.error;
   const delTask=await supabaseClient.from("tasks").delete().eq("id",taskId);
   if(delTask.error)throw delTask.error;
   localStorage.setItem("task-status-updated",String(Date.now()));
   alert("Tarefa excluída com sucesso.");
   window.location.href="tarefas.html";
 }catch(err){
   alert("Não foi possível excluir a tarefa: "+err.message);
 }
}
async function loadComments(){const box=document.getElementById("comments-list");const r=await supabaseClient.from("task_comments").select("id,body,user_id,created_at,attachment_path,attachment_name").eq("task_id",taskId).order("created_at",{ascending:true});if(r.error){box.innerHTML='<p class="empty-state">Não foi possível carregar os comentários: '+esc(r.error.message)+'</p>';return}const comments=r.data||[];if(!comments.length){box.innerHTML='<p class="empty-state">Nenhum comentário ainda.</p>';return}const ids=[...new Set(comments.map(c=>c.user_id).filter(Boolean))];const p=ids.length?await supabaseClient.from("profiles").select("id,name").in("id",ids):{data:[]};const names=Object.fromEntries((p.data||[]).map(x=>[x.id,x.name]));box.innerHTML=comments.map(c=>'<div class="comment-card"><div class="comment-head"><strong>'+esc(names[c.user_id]||"Usuário")+'</strong><span>'+new Date(c.created_at).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})+'</span></div><p>'+esc(c.body||"").replace(/\\n/g,"<br>")+'</p>'+(c.attachment_path?'<div class="comment-file"><span>📎 '+esc(c.attachment_name||"Arquivo anexado")+'</span><a href="#" class="comment-file-link" data-path="'+encodeURIComponent(c.attachment_path)+'">Abrir arquivo</a></div>':"")+'</div>').join("")}
async function openCommentFile(link,e){e.preventDefault();const path=decodeURIComponent(link.dataset.path||"");if(!path)return;const fileName=(link.closest(".comment-file")?.querySelector("span")?.textContent||"arquivo").replace(/^📎\\s*/,"").trim();try{const r=await supabaseClient.storage.from("task-attachments").download(path);if(r.error)throw r.error;if(!r.data)throw new Error("O arquivo não foi retornado pelo armazenamento.");const blobUrl=URL.createObjectURL(r.data);const a=document.createElement("a");a.href=blobUrl;a.download=fileName;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(blobUrl),2000)}catch(err){alert("Não foi possível baixar o arquivo: "+err.message)}}
document.getElementById("comments-list").addEventListener("click",e=>{const link=e.target.closest(".comment-file-link");if(link)openCommentFile(link,e)});
document.getElementById("comment-file").addEventListener("change",e=>{const f=e.target.files[0];document.getElementById("file-name").textContent=f?f.name:"Nenhum arquivo selecionado"});
document.getElementById("comment-form").addEventListener("submit",async e=>{e.preventDefault();const input=document.getElementById("comment-input"),fileInput=document.getElementById("comment-file"),status=document.getElementById("comment-status"),button=e.currentTarget.querySelector("button"),body=input.value.trim(),file=fileInput.files[0];if(!body&&!file){alert("Escreva um comentário ou anexe um arquivo.");return}if(!currentUser)return;button.disabled=true;status.textContent="Salvando…";try{let attachment_path=null,attachment_name=null;if(file){if(file.size>15*1024*1024)throw new Error("O arquivo deve ter no máximo 15 MB.");const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");attachment_path="comment-attachments/"+taskId+"/"+currentUser.id+"/"+Date.now()+"-"+safe;const up=await supabaseClient.storage.from("task-attachments").upload(attachment_path,file,{upsert:false});if(up.error)throw up.error;attachment_name=file.name}const r=await supabaseClient.from("task_comments").insert({task_id:taskId,user_id:currentUser.id,body:body||"Arquivo anexado.",attachment_path,attachment_name}).select("id,task_id,user_id,body,created_at,attachment_path,attachment_name").single();if(r.error)throw r.error;if(!r.data||r.data.task_id!==taskId){throw new Error("O banco não confirmou o comentário.");}input.value="";fileInput.value="";document.getElementById("file-name").textContent="Nenhum arquivo selecionado";status.textContent="Comentário adicionado.";await loadComments();setTimeout(()=>status.textContent="",1800)}catch(err){alert("Não foi possível salvar o comentário: "+err.message);status.textContent=""}finally{button.disabled=false}});
initFarmApp().then(async(ctx)=>{const u=await supabaseClient.auth.getUser();currentUser=u.data?.user||null;isAdmin=ctx?.profile?.role==="admin";await loadTask()}).catch(console.error);
</script></body></html>
