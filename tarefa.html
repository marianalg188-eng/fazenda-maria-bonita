function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}function dateText(v){if(!v)return"Sem prazo";const[y,m,d]=v.split("-");return d+"/"+m+"/"+y}
async function loadTask(){if(!taskId){document.getElementById("task-detail").innerHTML='<p class="empty-state">Tarefa não encontrada.</p>';return}try{const r=await supabaseClient.from("tasks").select("id,title,description,status,priority,due_date,responsible_id,requester_id,created_by,front,sector,category").eq("id",taskId).maybeSingle();if(r.error)throw r.error;if(!r.data){document.getElementById("task-detail").innerHTML='<p class="empty-state">Não foi possível encontrar esta tarefa.</p>';return}currentTask=r.data;const ids=[currentTask.responsible_id,currentTask.requester_id,currentTask.created_by].filter(Boolean);const p=ids.length?await supabaseClient.from("profiles").select("id,name").in("id",ids):{data:[]};if(p.error)throw p.error;people=p.data||[];let names=Object.fromEntries(people.map(x=>[x.id,x.name]));document.getElementById("task-detail").innerHTML='<div class="task-detail-card"><div class="detail-top"><div><span class="detail-label">TAREFA</span><h1 class="page-title">'+esc(currentTask.title)+'</h1></div><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="pill '+(currentTask.priority||"medium")+'">'+esc(priorities[currentTask.priority]||"Média")+'</span><button type="button" class="edit-task-btn" onclick="editTask()">Editar tarefa</button><button type="button" class="delete-task-btn" onclick="deleteTask()">Excluir tarefa</button></div></div><div class="detail-grid"><div><span class="detail-label">Status</span><strong>'+esc(labels[currentTask.status]||currentTask.status||"Pendente")+'</strong></div><div><span class="detail-label">Prazo</span><strong>'+dateText(currentTask.due_date)+'</strong></div><div><span class="detail-label">Responsável</span><strong>'+esc(names[currentTask.responsible_id]||"Não definido")+'</strong></div><div><span class="detail-label">Solicitante</span><strong>'+esc(names[currentTask.requester_id]||"Não definido")+'</strong></div><div><span class="detail-label">Centro de custo</span><strong>'+esc(currentTask.front||"Não informado")+'</strong></div><div><span class="detail-label">Área</span><strong>'+esc(currentTask.category||currentTask.sector||"Não informada")+'</strong></div></div><div class="detail-description"><span class="detail-label">Descrição / observações</span><p>'+esc(currentTask.description||"Nenhuma descrição informada.")+'</p></div></div>';document.getElementById("comments-section").style.display="block";loadComments()}catch(err){console.error(err);document.getElementById("task-detail").innerHTML='<p class="empty-state">Não foi possível carregar a tarefa: '+esc(err.message||"Erro desconhecido")+'</p>'}}
