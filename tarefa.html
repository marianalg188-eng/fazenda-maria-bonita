<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fazenda Maria Bonita · Tarefa</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="app.js"></script></head><body><main class="shell"><header class="topbar"><a class="brand" href="index.html"><div class="brand-mark">❧</div><div class="brand-text"><b>Fazenda</b><span>Maria Bonita</span></div></a><div class="user-actions"><a class="new-btn" href="nova-tarefa.html"><span class="plus">+</span><span class="label">Nova tarefa</span></a></div></header><a class="back" href="tarefas.html">← Voltar para tarefas</a><div id="task-detail"><p class="empty-state">Carregando tarefa…</p></div><div id="comments-section" class="detail-section" style="display:none"><div class="section-head"><div><h2>Comentários</h2><p class="page-sub">Registre atualizações, dúvidas ou informações importantes.</p></div></div><div id="comments-list" class="comments-list"><p class="empty-state">Nenhum comentário ainda.</p></div><form id="comment-form" class="comment-form"><textarea id="comment-input" rows="4" maxlength="2000" placeholder="Escreva um comentário..." required></textarea><div class="comment-actions"><span id="comment-status" class="form-hint"></span><button class="new-btn" type="submit">Adicionar comentário</button></div></form></div><div style="text-align:right;margin:18px 0"><a href="#" data-signout class="section-link">Sair →</a></div></main><nav class="bottom-nav"><a href="index.html"><span class="nav-icon">⌂</span>Início</a><a class="active" href="tarefas.html"><span class="nav-icon">☷</span>Tarefas</a><a href="equipe.html"><span class="nav-icon">♧</span>Equipe</a><a href="menu.html"><span class="nav-icon">☰</span>Menu</a></nav><script>
const taskId=new URLSearchParams(location.search).get("id");let currentUser=null;
const labels={pending:"Pendente",blocked:"Bloqueado · Pendência",in_progress:"Em andamento",completed:"Concluído",deprioritized:"Despriorizado",cancelled:"Cancelado"};
const priorities={urgent:"Urgente",high:"Alta",medium:"Média",low:"Baixa"};
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
function dateText(v){if(!v)return "Sem prazo";const [y,m,d]=v.split("-");return d+"/"+m+"/"+y}
async function loadTask(){if(!taskId){document.getElementById("task-detail").innerHTML='<p class="empty-state">Tarefa não encontrada.</p>';return}const r=await supabaseClient.from("tasks").select("*").eq("id",taskId).single();if(r.error||!r.data){document.getElementById("task-detail").innerHTML='<p class="empty-state">Não foi possível encontrar esta tarefa.</p>';return}const t=r.data;let names={};const ids=[t.responsible_id,t.requester_id,t.created_by].filter(Boolean);if(ids.length){const p=await supabaseClient.from("profiles").select("id,name").in("id",[...new Set(ids)]);if(!p.error)names=Object.fromEntries((p.data||[]).map(x=>[x.id,x.name]))}document.getElementById("task-detail").innerHTML='<div class="task-detail-card"><div class="detail-top"><div><span class="detail-label">TAREFA</span><h1 class="page-title">'+esc(t.title)+'</h1></div><span class="pill '+(t.priority||"medium")+'">'+esc(priorities[t.priority]||"Média")+'</span></div><div class="detail-grid"><div><span class="detail-label">Status</span><strong>'+esc(labels[t.status]||t.status||"Pendente")+'</strong></div><div><span class="detail-label">Prazo</span><strong>'+dateText(t.due_date)+'</strong></div><div><span class="detail-label">Responsável</span><strong>'+esc(names[t.responsible_id]||"Não definido")+'</strong></div><div><span class="detail-label">Solicitante</span><strong>'+esc(names[t.requester_id]||"Não definido")+'</strong></div><div><span class="detail-label">Centro de custo</span><strong>'+esc(t.front||"Não informado")+'</strong></div><div><span class="detail-label">Área</span><strong>'+esc(t.category||t.sector||"Não informada")+'</strong></div></div><div class="detail-description"><span class="detail-label">Descrição / observações</span><p>'+esc(t.description||"Nenhuma descrição informada.")+'</p></div></div>';document.getElementById("comments-section").style.display="block";loadComments()}
async function loadComments(){const box=document.getElementById("comments-list");const r=await supabaseClient.from("task_comments").select("id,body,user_id,created_at").eq("task_id",taskId).order("created_at",{ascending:true});if(r.error){box.innerHTML='<p class="empty-state">Não foi possível carregar os comentários: '+esc(r.error.message)+'</p>';return}const comments=r.data||[];if(!comments.length){box.innerHTML='<p class="empty-state">Nenhum comentário ainda.</p>';return}const ids=[...new Set(comments.map(c=>c.user_id).filter(Boolean))];const p=ids.length?await supabaseClient.from("profiles").select("id,name").in("id",ids):{data:[]};const names=Object.fromEntries((p.data||[]).map(x=>[x.id,x.name]));box.innerHTML=comments.map(c=>'<div class="comment-card"><div class="comment-head"><strong>'+esc(names[c.user_id]||"Usuário")+'</strong><span>'+new Date(c.created_at).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})+'</span></div><p>'+esc(c.body).replace(/\n/g,"<br>")+'</p></div>').join("")}
document.getElementById("comment-form").addEventListener("submit",async e=>{e.preventDefault();const input=document.getElementById("comment-input"),status=document.getElementById("comment-status"),button=e.currentTarget.querySelector("button"),body=input.value.trim();if(!body||!currentUser)return;button.disabled=true;status.textContent="Salvando…";const r=await supabaseClient.from("task_comments").insert({task_id:taskId,user_id:currentUser.id,body});if(r.error){status.textContent="";button.disabled=false;alert("Não foi possível salvar o comentário: "+r.error.message);return}input.value="";status.textContent="Comentário adicionado.";button.disabled=false;await loadComments();setTimeout(()=>status.textContent="",1800)});
initFarmApp().then(async()=>{const u=await supabaseClient.auth.getUser();currentUser=u.data?.user||null;await loadTask()}).catch(console.error);
</script></body></html>
