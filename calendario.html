<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fazenda Maria Bonita · Calendário</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="app.js"></script>
<style>
.calendar-wrap{background:#f8f5ed;border:1px solid #e4dfd3;border-radius:20px;padding:18px;margin-top:20px}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.calendar-head button{border:1px solid #d9d2c3;background:#fff;border-radius:10px;width:40px;height:40px;font-size:22px;cursor:pointer;color:#5f684f}.calendar-head h2{margin:0;font-family:Georgia,serif;font-size:22px;color:#30352d}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.calendar-grid .weekday{text-align:center;font-size:11px;font-weight:700;color:#8b887d;padding:7px 0}.day{min-height:104px;background:#fff;border:1px solid #e6e1d7;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:5px;overflow:hidden}.day.empty{background:transparent;border-color:transparent}.day.today{border:2px solid #87987d}.day-number{font-weight:700;font-size:13px;color:#45483f}.day-task{display:block;text-decoration:none;color:#3f4939;background:#eef0e8;border-left:3px solid #87987d;border-radius:7px;padding:5px 6px;font-size:11px;line-height:1.2;overflow:hidden}.day-task.priority-urgent{border-left-color:#c76852}.day-task.priority-high{border-left-color:#d39a68}.day-task.completed{opacity:.55;text-decoration:line-through}.day-task strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.day-task small{display:block;margin-top:2px;color:#77796f}.calendar-loading{padding:30px;text-align:center;color:#77796f}@media(max-width:700px){.calendar-wrap{padding:10px}.calendar-grid{gap:4px}.day{min-height:82px;padding:5px}.day-task{font-size:10px;padding:4px}.day-task small{display:none}.calendar-head h2{font-size:18px}}
</style></head>
<body><main class="shell"><script>initFarmApp();</script>
<header class="topbar"><a class="brand" href="index.html"><div class="brand-mark">❧</div><div class="brand-text"><b>Fazenda</b><span>Maria Bonita</span></div></a><a class="new-btn" href="nova-tarefa.html"><span>+</span><span class="label">Nova tarefa</span></a></header>
<a class="back" href="menu.html">← Menu</a><h1 class="page-title">Calendário</h1><p class="page-sub">Visualize os prazos de entrega de todas as tarefas criadas.</p>
<section class="calendar-wrap"><div class="calendar-head"><button id="prevMonth" aria-label="Mês anterior">‹</button><h2 id="monthTitle">Calendário</h2><button id="nextMonth" aria-label="Próximo mês">›</button></div><div id="calendarGrid" class="calendar-grid"><div class="calendar-loading">Carregando tarefas...</div></div></section>
<section class="section-card"><div class="section-head"><h2 id="upcomingTitle">Próximos prazos</h2></div><div id="upcomingList"><div class="calendar-loading">Carregando...</div></div></section>
</main>
<nav class="bottom-nav"><a href="index.html"><span class="nav-icon">⌂</span>Início</a><a href="tarefas.html"><span class="nav-icon">☷</span>Tarefas</a><a href="equipe.html"><span class="nav-icon">♧</span>Equipe</a><a class="active" href="menu.html"><span class="nav-icon">☰</span>Menu</a></nav>
<script>
const monthNames=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"],weekdays=["SEG","TER","QUA","QUI","SEX","SÁB","DOM"];
let currentMonth=new Date();currentMonth.setDate(1);let tasks=[],profiles=[];
const dateKey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const formatDateBR=v=>{if(!v)return"";const[y,m,d]=v.split("-");return d+"/"+m+"/"+y};
const responsibleName=id=>profiles.find(p=>p.id===id)?.name||"Sem responsável";
const priorityClass=p=>String(p||"").toLowerCase().includes("urg")?"priority-urgent":String(p||"").toLowerCase().includes("alta")?"priority-high":"";
const statusLabel=s=>({pending:"Pendente",blocked:"Bloqueado",in_progress:"Em andamento",completed:"Concluído",deprioritized:"Despriorizado",cancelled:"Cancelado"})[s]||"Pendente";
const escapeHtml=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
async function loadCalendar(){
 const[tr,pr]=await Promise.all([supabaseClient.from("tasks").select("id,title,priority,status,due_date,responsible_id,front,sector").not("due_date","is",null).order("due_date",{ascending:true}),supabaseClient.from("profiles").select("id,name").eq("active",true)]);
 if(tr.error)throw tr.error;if(pr.error)throw pr.error;tasks=tr.data||[];profiles=pr.data||[];renderCalendar();renderUpcoming();
}
function renderCalendar(){
 const grid=document.getElementById("calendarGrid"),y=currentMonth.getFullYear(),m=currentMonth.getMonth();document.getElementById("monthTitle").textContent=monthNames[m]+" "+y;grid.innerHTML="";
 weekdays.forEach(w=>{const e=document.createElement("div");e.className="weekday";e.textContent=w;grid.appendChild(e)});
 const first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),today=dateKey(new Date());
 for(let i=0;i<offset;i++){const e=document.createElement("div");e.className="day empty";grid.appendChild(e)}
 for(let d=1;d<=days;d++){const key=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"),cell=document.createElement("div");cell.className="day"+(key===today?" today":"");const num=document.createElement("div");num.className="day-number";num.textContent=d;cell.appendChild(num);
  tasks.filter(t=>t.due_date===key).forEach(t=>{const a=document.createElement("a");a.className="day-task "+priorityClass(t.priority)+(t.status==="completed"?" completed":"");a.href="tarefa.html?id="+encodeURIComponent(t.id);a.innerHTML="<strong>"+escapeHtml(t.title||"Sem título")+"</strong><small>"+escapeHtml(responsibleName(t.responsible_id))+"</small>";a.title=(t.title||"")+" · "+statusLabel(t.status);cell.appendChild(a)});grid.appendChild(cell)}
}
function renderUpcoming(){
 const list=document.getElementById("upcomingList"),today=dateKey(new Date()),future=tasks.filter(t=>t.due_date>=today).slice(0,8);if(!future.length){list.innerHTML='<div class="event-card"><span>Nenhuma tarefa com prazo futuro.</span></div>';return}list.innerHTML="";
 future.forEach(t=>{const row=document.createElement("a");row.href="tarefa.html?id="+encodeURIComponent(t.id);row.className="event-card";row.style.textDecoration="none";row.style.display="block";row.innerHTML="<b>"+formatDateBR(t.due_date)+" · "+escapeHtml(t.title||"Sem título")+"</b><span>"+escapeHtml(responsibleName(t.responsible_id))+" · "+statusLabel(t.status)+"</span>";list.appendChild(row)})
}
document.getElementById("prevMonth").addEventListener("click",()=>{currentMonth.setMonth(currentMonth.getMonth()-1);renderCalendar()});
document.getElementById("nextMonth").addEventListener("click",()=>{currentMonth.setMonth(currentMonth.getMonth()+1);renderCalendar()});
loadCalendar().catch(err=>{console.error(err);document.getElementById("calendarGrid").innerHTML='<div class="calendar-loading">Não foi possível carregar as tarefas.</div>';document.getElementById("upcomingList").innerHTML='<div class="event-card"><span>Erro ao carregar os prazos.</span></div>'});
</script></body></html>
