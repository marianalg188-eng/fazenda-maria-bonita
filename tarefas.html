<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fazenda Maria Bonita · Tarefas</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="app.js"></script></head><body><main class="shell"><header class="topbar"><a class="brand" href="index.html"><div class="brand-mark">❧</div><div class="brand-text"><b>Fazenda</b><span>Maria Bonita</span></div></a><div class="user-actions"><a class="new-btn" href="nova-tarefa.html"><span class="plus">+</span><span class="label">Nova tarefa</span></a></div></header><a class="back" href="index.html">← Voltar</a><h1 class="page-title">Tarefas</h1><p class="page-sub">Tudo o que precisa acontecer na fazenda.</p><div class="tabs"><button class="active" data-filter="all">Todas</button><button data-filter="today">Hoje</button><button data-filter="overdue">Atrasadas</button><button data-filter="completed">Concluídas</button><button data-filter="blocked">Bloqueadas</button><button data-filter="in_progress">Em andamento</button><button data-filter="deprioritized">Despriorizadas</button></div><div class="task-filters" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 14px"><select id="creator-filter" class="search" style="width:100%;cursor:pointer"><option value="">Criada por: todos</option></select><select id="responsible-filter" class="search" style="width:100%;cursor:pointer"><option value="">Responsável: todos</option></select></div><input class="search" id="task-search" placeholder="⌕  Buscar tarefas..."><div class="list-card" id="task-list"><p class="empty-state">Carregando tarefas…</p></div><a class="fab" href="nova-tarefa.html">+</a><div style="text-align:right;margin:18px 0"><a href="#" data-signout class="section-link">Sair →</a></div></main><nav class="bottom-nav"><a href="index.html"><span class="nav-icon">⌂</span>Início</a><a class="active" href="tarefas.html"><span class="nav-icon">☷</span>Tarefas</a><a href="equipe.html"><span class="nav-icon">♧</span>Equipe</a><a href="menu.html"><span class="nav-icon">☰</span>Menu</a></nav><script>
let allTasks=[],currentFilter="all",profilesById={};
async function loadTasks(){const box=document.getElementById("task-list");try{const r=await supabaseClient.from("tasks").select("*").order("due_date",{ascending:true});if(r.error)throw r.error;allTasks=r.data||[];const ids=[...new Set(allTasks.flatMap(t=>[t.responsible_id,t.created_by]).filter(Boolean))];const p=await supabaseClient.from("profiles").select("id,name").in("id",ids);if(!p.error){profilesById=Object.fromEntries((p.data||[]).map(x=>[x.id,x.name]));allTasks=allTasks.map(t=>({...t,responsible_name:profilesById[t.responsible_id]||null,creator_name:profilesById[t.created_by]||null}))}populateUserFilters();renderTasks();document.querySelectorAll("[data-filter]").forEach(btn=>btn.onclick=()=>{document.querySelectorAll("[data-filter]").forEach(b=>b.classList.remove("active"));btn.classList.add("active");currentFilter=btn.dataset.filter;renderTasks()});document.getElementById("task-search").oninput=renderTasks}catch(e){console.error(e);box.innerHTML='<p class="empty-state">Erro ao carregar tarefas: '+escapeHtml(e.message||String(e))+'</p>'}}
function renderTasks(){const q=document.getElementById("task-search").value.toLowerCase(),creator=document.getElementById("creator-filter").value,responsible=document.getElementById("responsible-filter").value,today=new Date().toISOString().slice(0,10);const list=allTasks.filter(t=>{const match=!q||[t.title,t.description,t.category,t.front].filter(Boolean).join(" ").toLowerCase().includes(q);const filter=currentFilter==="all"||(currentFilter==="completed"&&t.status==="completed")||(currentFilter==="blocked"&&t.status==="blocked")||(currentFilter==="in_progress"&&t.status==="in_progress")||(currentFilter==="deprioritized"&&t.status==="deprioritized")||(currentFilter==="today"&&t.due_date===today&&t.status!=="completed"&&t.status!=="deprioritized")||(currentFilter==="overdue"&&t.due_date<today&&t.status!=="completed"&&t.status!=="deprioritized");const creatorMatch=!creator||String(t.created_by||"")===String(creator);const responsibleMatch=!responsible||String(t.responsible_id||"")===String(responsible);return match&&filter&&creatorMatch&&responsibleMatch});const box=document.getElementById("task-list");if(!list.length){box.innerHTML='<p class="empty-state">Nenhuma tarefa encontrada.</p>';return}box.innerHTML=list.map(t=>'<div class="task-row"><a class="task-main task-link" href="tarefa.html?id='+encodeURIComponent(t.id)+'"><div class="task-title">'+escapeHtml(t.title)+'</div><div class="task-meta">'+escapeHtml(t.front||"Sem centro de custo")+' · '+(t.due_date||"Sem prazo")+' · '+escapeHtml(t.responsible_name||"Sem responsável")+'</div></a><select class="status-select" data-task-id="'+t.id+'"><option value="pending" '+(t.status==="pending"?"selected":"")+'>Pendente</option><option value="blocked" '+(t.status==="blocked"?"selected":"")+'>Bloqueado · Pendência</option><option value="in_progress" '+(t.status==="in_progress"?"selected":"")+'>Em andamento</option><option value="completed" '+(t.status==="completed"?"selected":"")+'>Concluído</option><option value="deprioritized" '+(t.status==="deprioritized"?"selected":"")+'>Despriorizado</option></select><span class="pill '+(t.priority||"medium")+'">'+({urgent:"Urgente",high:"Alta",medium:"Média",low:"Baixa"}[t.priority]||"Média")+'</span></div>').join("");document.querySelectorAll(".status-select").forEach(s=>s.onchange=()=>changeStatus(s.dataset.taskId,s.value,s))}
async function changeStatus(id,status,selectEl){const allowed=["pending","blocked","in_progress","completed","deprioritized"];if(!allowed.includes(status))return;const old=allTasks.find(t=>t.id===id)?.status;selectEl&&(selectEl.disabled=true);try{const updatedAt=new Date().toISOString();const {error}=await supabaseClient.from("tasks").update({status,updated_at:updatedAt,updated_by:(await supabaseClient.auth.getUser()).data.user?.id}).eq("id",id);if(error)throw error;const check=await supabaseClient.from("tasks").select("id,status,updated_at").eq("id",id);if(check.error)throw check.error;const saved=(check.data||[]).find(t=>t.id===id);if(!saved||saved.status!==status)throw new Error("O banco não confirmou a alteração do status.");const task=allTasks.find(t=>t.id===id);if(task)task.status=saved.status;localStorage.setItem("task-status-updated",String(Date.now()));renderTasks()}catch(e){alert("Não foi possível salvar o status: "+e.message);if(selectEl)selectEl.value=old||"pending";if(selectEl)selectEl.disabled=false}}
function populateUserFilters(){const creators=[...new Set(allTasks.map(t=>t.created_by).filter(id=>id&&profilesById[id]))].map(id=>[id,profilesById[id]||"Usuário"]).sort((a,b)=>a[1].localeCompare(b[1]));const responsibles=[...new Set(allTasks.map(t=>t.responsible_id).filter(id=>id&&profilesById[id]))].map(id=>[id,profilesById[id]||"Usuário"]).sort((a,b)=>a[1].localeCompare(b[1]));const cf=document.getElementById("creator-filter"),rf=document.getElementById("responsible-filter"),cv=cf.value,rv=rf.value;cf.innerHTML='<option value="">Criada por: todos</option>'+creators.map(x=>'<option value="'+escapeHtml(x[0])+'">'+escapeHtml(x[1])+'</option>').join("");rf.innerHTML='<option value="">Responsável: todos</option>'+responsibles.map(x=>'<option value="'+escapeHtml(x[0])+'">'+escapeHtml(x[1])+'</option>').join("");cf.value=cv;rf.value=rv}function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
document.getElementById("creator-filter").addEventListener("change",function(){renderTasks()});document.getElementById("responsible-filter").addEventListener("change",function(){renderTasks()});document.getElementById("task-search").addEventListener("input",function(){renderTasks()});initFarmApp().then(loadTasks).catch(console.error);
</script></body></html>
