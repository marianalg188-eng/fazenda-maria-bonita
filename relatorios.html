<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fazenda Maria Bonita · Relatórios</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="app.js"></script></head><body><main class="shell"><header class="topbar"><a class="brand" href="index.html"><div class="brand-mark">❧</div><div class="brand-text"><b>Fazenda</b><span>Maria Bonita</span></div></a></header><a class="back" href="menu.html">← Menu</a><h1 class="page-title">Relatórios</h1><p class="page-sub">Acesse cada área da gestão da fazenda.</p><div class="report-grid"><a class="report-card" href="animais.html#animais-por-fazenda"><span>🐄</span><b>Animais por fazenda</b><small>Rebanho, baixas e vendas.</small></a><a class="report-card" href="tarefas.html"><span>☷</span><b>Tarefas</b><small>Conclusões, atrasos e responsáveis.</small></a><a class="report-card" href="estoque.html"><span>📦</span><b>Estoque</b><small>Itens e compras.</small></a><a class="report-card" href="financeiro.html"><span>💰</span><b>Financeiro</b><small>Entradas e saídas.</small></a></div><div style="text-align:right;margin:18px 0"><a href="#" data-signout class="section-link">Sair →</a></div></main><nav class="bottom-nav"><a href="index.html"><span class="nav-icon">⌂</span>Início</a><a href="tarefas.html"><span class="nav-icon">☷</span>Tarefas</a><a href="equipe.html"><span class="nav-icon">♧</span>Equipe</a><a class="active" href="menu.html"><span class="nav-icon">☰</span>Menu</a></nav><script>
async function loadReport(){const {data,error}=await supabaseClient.from("farm_animal_summary").select("animal_count,death_count,sale_count,farms(code,name)").order("animal_count",{ascending:false});const box=document.getElementById("farm-summary");if(error){box.innerHTML='<p class="empty-state">Não foi possível carregar o relatório.</p>';return}let ta=0,td=0,ts=0;(data||[]).forEach(x=>{ta+=x.animal_count;td+=x.death_count;ts+=x.sale_count});document.getElementById("total-animals").textContent=ta;document.getElementById("total-deaths").textContent=td;document.getElementById("total-sales").textContent=ts;document.getElementById("total-farms").textContent=(data||[]).length;box.innerHTML=(data||[]).map(x=>'<div class="task-row"><div class="task-main"><div class="task-title">'+esc(x.farms?.code)+" · "+esc(x.farms?.name)+'</div><div class="task-meta">Animais: '+x.animal_count+' · Baixas: '+x.death_count+' · Vendas: '+x.sale_count+'</div></div></div>').join("")||'<p class="empty-state">Nenhum dado disponível.</p>'}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
requireAuth().then(()=>{initFarmApp();loadReport()});
</script></body></html>
